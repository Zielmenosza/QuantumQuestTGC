# Project-wide Gradle settings.

# JVM arguments for Gradle daemon
org.gradle.jvmargs=-Xmx4096m

# Enables parallel build execution
org.gradle.parallel=true

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

kotlin.incremental=false

# Enables namespacing of each library's R class
android.nonTransitiveRClass=true

android.enableR8.fullMode=false

org.gradle.warning.mode=none

kotlin.compiler.execution.strategy=in-process

# Keep developer-machine paths out of committed Gradle config.
# Set Java/Android SDK/NDK locations in local.properties, Android Studio, or environment variables.
org.gradle.configuration-cache=false
